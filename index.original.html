<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bean World</title>
<meta name="theme-color" content="#0d1032">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe2ff;color:#14233f;font:600 13px/1.3 Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.chip{position:fixed;background:rgba(255,255,255,.82);border-radius:12px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,35,63,.14)}
#hud{top:calc(12px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:baseline}
#hud small{font-weight:500;opacity:.7}#st{font-size:15px;min-width:3.6em;font-variant-numeric:tabular-nums}
#hint{top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));font-weight:500;max-width:46vw;line-height:1.5}
#err{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:15px}
#fs{font:inherit;color:#14233f;background:#fff;border:0;border-radius:8px;width:30px;height:28px;display:grid;place-items:center;cursor:pointer;align-self:center;margin-inline-start:4px}
#rot{position:fixed;inset:0;z-index:20;background:rgba(20,35,63,.88);display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
#rot p{font-size:17px;margin:0 0 16px}#rot button{display:block;margin:8px auto;font:inherit;border:0;border-radius:14px;padding:11px 20px;background:#ff1080;color:#fff;cursor:pointer;min-width:200px}

:root{--m:12px;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sT:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--glass:rgba(12,17,42,.8);--line:rgba(255,255,255,.16);--acc:#ffd23f;--pk:#ff1080;--h:44px}
#rot[hidden]{display:none}button{font-family:inherit}svg{display:block;flex:none}
.scr{display:none}body.inauth #auth{display:grid}body.inlobby #lobby{display:block}body.insplash #splash{display:grid}
body:not(.inworld) #hud,body:not(.inworld) #hint,body:not(.inworld) #joy,body:not(.inworld) #acts,body:not(.inworld) #menuBtn{display:none}
#fs{width:38px;height:34px}
/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:7;place-items:center;align-content:center;gap:8px;text-align:center;direction:rtl;color:#fff;padding:var(--m);background:radial-gradient(circle at 50% 45%,rgba(255,16,128,.28),rgba(5,8,24,.9))}
#splash h1{margin:0;font:900 clamp(34px,12vmin,88px)/1 Cairo,system-ui,sans-serif;letter-spacing:.06em;text-shadow:0 4px 0 var(--pk),0 0 44px rgba(255,16,128,.6)}
#splash p{margin:0 0 14px;opacity:.75;font-size:14px}
#startBtn,#play{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;box-sizing:border-box;border:0;cursor:pointer;background:var(--acc);color:#14181f;font:900 22px/1 Cairo,system-ui,sans-serif;padding:0 44px;border-radius:8px;transform:skewX(-8deg);box-shadow:0 6px 0 #c99a14,0 12px 30px rgba(255,210,63,.4)}
#startBtn:active,#play:active{transform:skewX(-8deg) translateY(4px);box-shadow:0 2px 0 #c99a14}
/* تسجيل الدخول */
#auth{position:fixed;inset:0;z-index:6;place-items:center;padding:var(--m) calc(var(--m) + var(--sr)) calc(var(--m) + var(--sb)) calc(var(--m) + var(--sl));pointer-events:none}
.card0{pointer-events:auto;direction:rtl;text-align:right;box-sizing:border-box;width:min(380px,100%);max-height:100%;overflow:auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:18px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.brand{margin:0 0 12px;text-align:center;font:900 26px/1 Cairo,system-ui,sans-serif;letter-spacing:3px;text-shadow:0 2px 0 var(--pk)}
.card0 label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;opacity:.75}
.card0 input{width:100%;box-sizing:border-box;height:42px;font:inherit;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;outline:0;-webkit-user-select:text;user-select:text}
.card0 input:focus{border-color:var(--acc)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}.tabs button{flex:1;height:36px;font-size:14px;font-weight:700;border:0;background:0;border-radius:9px;cursor:pointer;color:#fff;opacity:.7}.tabs button.on{background:var(--acc);color:#14181f;opacity:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;font-size:15px;font-weight:800;border:0;border-radius:12px;margin-top:12px;cursor:pointer;background:var(--acc);color:#14181f}.btn:disabled{opacity:.45;cursor:default}
.msg{min-height:18px;margin-top:8px;color:#ff7b8f;font-size:13px}
/* اللوبي */
#lobby{position:fixed;inset:0;z-index:6;color:#fff;pointer-events:none;direction:rtl}#lobby>*{pointer-events:auto}
#lobby::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,8,24,.7),transparent 22%,transparent 72%,rgba(5,8,24,.7))}
#top{position:absolute;top:calc(var(--m) + var(--sT));left:calc(var(--m) + var(--sl));right:calc(var(--m) + var(--sr));display:flex;justify-content:space-between;align-items:center;direction:ltr;pointer-events:none}
#top>*{pointer-events:auto}#topR{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:var(--h);box-sizing:border-box;padding:0 12px;direction:rtl;background:var(--glass);border:1px solid var(--line);border-radius:14px;color:#fff;font:inherit;font-size:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button.pill{cursor:pointer}.ib{width:var(--h);padding:0;justify-content:center}
#av{width:30px;height:30px;border-radius:9px;background:var(--pk);display:grid;place-items:center;font-weight:900}
.pill small{display:block;opacity:.65;font-size:11px;line-height:1.1}.pill b{display:block;line-height:1.2;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#coins{color:var(--acc);font-weight:800}
#nav{position:absolute;right:calc(var(--m) + var(--sr));top:calc(var(--m) + var(--sT) + var(--h) + 10px);display:flex;flex-direction:column;gap:8px}
#nav button{width:54px;height:54px;border-radius:15px;border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;opacity:.9}
#nav button.on{background:var(--acc);color:#14181f;opacity:1}
#play{position:absolute;left:calc(var(--m) + var(--sl) + 6px);bottom:calc(var(--m) + var(--sb) + 6px)}
#sheet{position:absolute;right:calc(var(--m) + var(--sr) + 64px);top:calc(var(--m) + var(--sT) + var(--h) + 10px);bottom:calc(var(--m) + var(--sb));width:min(320px,calc(100vw - 150px - var(--sl) - var(--sr)));display:none;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:pop .25s ease}
#sheet.on{display:flex}@keyframes pop{from{opacity:0;transform:translateX(14px)}}
#shh{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}#shh h2{margin:0;font-size:17px}#shh .ib{height:38px;width:38px}
#shb{padding:12px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin-top:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:80px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid transparent;cursor:pointer;font-size:12px;font-weight:700;text-align:center}
.card.sq{min-height:0;aspect-ratio:1;padding:6px}.card.on{border-color:var(--acc);background:rgba(255,210,63,.14)}.card i{width:66%;aspect-ratio:1;border-radius:50%;border:3px solid #fff}.card img{width:100%;border-radius:10px}
.card em{display:flex;align-items:center;gap:3px;font-style:normal;color:var(--acc);font-size:12px}.card em svg{width:14px;height:14px}
.mut{opacity:.6;font-size:13px;grid-column:1/-1;text-align:center}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.row span{opacity:.65}
#big{width:76px;height:76px;border-radius:22px;background:var(--pk);display:grid;place-items:center;font:900 34px Cairo,system-ui;margin:2px auto 10px}
#toast{position:fixed;left:50%;bottom:calc(var(--m) + var(--sb) + 76px);transform:translateX(-50%);max-width:86vw;background:#fff;color:#14181f;font-weight:700;font-size:14px;padding:10px 18px;border-radius:12px;z-index:30;display:none;text-align:center}
/* داخل العالم */
#menuBtn{position:fixed;top:calc(var(--m) + var(--sT));right:calc(var(--m) + var(--sr));height:38px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:#14233f;background:rgba(255,255,255,.88);border:0;border-radius:12px;padding:0 14px;box-shadow:0 2px 10px rgba(20,35,63,.16);cursor:pointer;z-index:4}
body.inworld #hint{top:calc(var(--m) + var(--sT) + 46px)}
/* وضع الطول */
@media (orientation:portrait){
#nav{top:auto;right:50%;transform:translateX(50%);bottom:calc(var(--m) + var(--sb));flex-direction:row}
#play{left:calc(var(--m) + var(--sl));right:calc(var(--m) + var(--sr));bottom:calc(var(--m) + var(--sb) + 66px);transform:none;box-shadow:0 5px 0 #c99a14}#play:active{transform:translateY(4px)}
#sheet{left:calc(var(--m) + var(--sl));right:calc(var(--m) + var(--sr));width:auto;top:auto;bottom:calc(var(--m) + var(--sb) + 132px);height:min(42vh,340px)}
#toast{bottom:calc(var(--m) + var(--sb) + 140px)}}
/* شاشات قصيرة (جوال بالعرض) */
@media (max-height:480px){
.card0{padding:12px 16px;width:min(340px,100%)}.brand{font-size:20px;margin-bottom:8px}.card0 label{margin:6px 0 3px;font-size:11px}.card0 input{height:36px}.tabs button{height:32px}.btn{height:40px;margin-top:8px}.msg{min-height:14px;margin-top:4px;font-size:12px}
:root{--h:40px}#nav button{width:50px;height:50px}#sheet{right:calc(var(--m) + var(--sr) + 60px)}#play{height:50px;font-size:20px;padding:0 36px}.card{min-height:72px}}

/* ===== واجهة اللعب بأسلوب ألعاب الجوال: أزرار دائرية بأيقونات ===== */
:root{--J:clamp(66px,20vmin,92px);--JS:clamp(112px,34vmin,150px)}
body.inworld{-webkit-touch-callout:none}
#joy{position:fixed;left:0;top:0;bottom:0;width:50%;z-index:2;touch-action:none;-webkit-tap-highlight-color:transparent}
#jbase{position:absolute;left:calc(26px + var(--sl));bottom:calc(30px + var(--sb));width:var(--JS);height:var(--JS);border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(20,35,63,.18),inset 0 0 22px rgba(255,255,255,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:.6;transition:opacity .15s}
#jbase.act{opacity:1;background:rgba(255,255,255,.3)}
@media (pointer:fine){#joy{pointer-events:none}#jbase{pointer-events:auto}}
#hud{z-index:5}
#knob{width:42%;height:42%;border-radius:50%;background:var(--pk);border:3px solid #fff;box-shadow:0 3px 10px rgba(255,16,128,.45);pointer-events:none;will-change:transform}
#acts{position:fixed;inset:0;pointer-events:none;z-index:3}
.cb{position:absolute;display:grid;place-items:center;padding:0;margin:0;border:2px solid rgba(255,255,255,.85);border-radius:50%;color:#14233f;background:rgba(255,255,255,.55);box-shadow:0 4px 14px rgba(20,35,63,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:auto;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .12s,color .12s}
.cb svg{width:48%;height:48%}
.cb:active{transform:scale(.9)}
.cb.on{background:var(--acc);color:#14181f;border-color:#fff}
.cb:focus-visible{outline:3px solid #14233f;outline-offset:2px}
#bJump{width:var(--J);height:var(--J);right:calc(26px + var(--sr));bottom:calc(30px + var(--sb));background:var(--pk);color:#fff;box-shadow:0 5px 18px rgba(255,16,128,.5)}
#bJump:active{background:#e00070}
#bRun{width:calc(var(--J)*.7);height:calc(var(--J)*.7);right:calc(26px + var(--sr) + var(--J) + 14px);bottom:calc(30px + var(--sb))}
#bEmo{width:calc(var(--J)*.62);height:calc(var(--J)*.62);right:calc(26px + var(--sr) + var(--J)*.19);bottom:calc(30px + var(--sb) + var(--J) + 14px)}
#emos{position:absolute;right:calc(26px + var(--sr) + var(--J)*.81 + 10px);bottom:calc(30px + var(--sb) + var(--J) + 14px + var(--J)*.035);display:none;flex-direction:row-reverse;gap:8px;pointer-events:none}
#emos.open{display:flex;animation:emo .16s ease-out}
@keyframes emo{from{opacity:0;transform:translateX(12px) scale(.9)}}
#emos .cb{position:static;width:calc(var(--J)*.55);height:calc(var(--J)*.55)}
@media (orientation:portrait){#emos{flex-direction:column-reverse;right:calc(26px + var(--sr) + var(--J)*.19 + var(--J)*.035);bottom:calc(30px + var(--sb) + var(--J) + 14px + var(--J)*.62 + 10px)}}
/* الواجهة العلوية: أزرار دائرية مبسّطة */
#hud{display:none}
#hud small,#st{display:none}
#fs,#menuBtn{width:44px;height:44px;margin:0;padding:0;border-radius:50%;display:grid;place-items:center;color:#14233f;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 12px rgba(20,35,63,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#fs svg,#menuBtn svg{width:22px;height:22px}
#menuBtn span{display:none}
@media (pointer:coarse){#hint{display:none}}

/* ===================== ثيم «هدوء»: Cairo + ألوان ناعمة + حركة سلسة ===================== */
:root{--pk:#ff74b4;--acc:#ffdc8f;--glass:rgba(22,26,62,.58);--line:rgba(255,255,255,.16);--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.4,0,.2,1)}
html,body,button,input{font-family:Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
/* طبقات الجو العام */
#aur,#vig,#veil{position:fixed;inset:0;pointer-events:none}
#vig{z-index:1;background:radial-gradient(125% 125% at 50% 45%,transparent 58%,rgba(14,18,48,.26) 100%),linear-gradient(180deg,rgba(255,226,206,.05),transparent 38%,rgba(130,150,255,.07))}
#aur{z-index:1;overflow:hidden;opacity:0;transition:opacity 1.2s var(--soft)}
body.insplash #aur,body.inauth #aur,body.inlobby #aur{opacity:.6}
#aur::before{content:"";position:absolute;inset:-30%;background:radial-gradient(38% 46% at 22% 30%,rgba(255,116,180,.42),transparent 70%),radial-gradient(42% 50% at 78% 72%,rgba(120,150,255,.4),transparent 70%),radial-gradient(34% 40% at 62% 18%,rgba(140,240,210,.26),transparent 70%);animation:aur 30s ease-in-out infinite alternate;will-change:transform}
#veil{z-index:15;opacity:0;transition:opacity .34s var(--soft);background:radial-gradient(circle at 50% 50%,#2b2670,#0d1032 78%)}
#veil.on{opacity:1;pointer-events:auto}
#veil i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;box-shadow:0 0 30px 8px rgba(255,200,230,.5);animation:pulse 1.3s ease-in-out infinite}
/* شاشة البداية */
#splash{background:radial-gradient(110% 90% at 50% 42%,rgba(110,90,255,.2),rgba(8,10,32,.7) 72%);animation:fadeIn .9s var(--soft) backwards}
#splash h1{font-weight:900;letter-spacing:.05em;color:transparent;background:linear-gradient(115deg,#fff 15%,#ffc4e2 48%,#cdb8ff 85%);-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 8px 30px rgba(255,126,182,.42));animation:fadeIn 1.2s var(--soft) backwards,floaty 7s ease-in-out infinite}
#splash p{animation:fadeUp 1s .25s var(--ease) backwards}
#startBtn,#play{transform:none;border-radius:999px;background:linear-gradient(135deg,#ffe8a8,#ffb6d6 60%,#d2b8ff);color:#2b2447;font-weight:800;box-shadow:0 10px 34px rgba(255,150,200,.42);transition:transform .25s var(--ease),box-shadow .3s}
#startBtn:active,#play:active{transform:scale(.95);box-shadow:0 4px 14px rgba(255,150,200,.4)}
#startBtn{animation:fadeUp 1s .45s var(--ease) backwards,glow 4s 1.5s ease-in-out infinite}
body.inlobby #play{animation:riseIn .8s .35s var(--ease) backwards,glow 4s 1.4s ease-in-out infinite}
/* تسجيل الدخول */
.card0{border-radius:28px;background:linear-gradient(165deg,rgba(40,44,96,.7),rgba(16,18,48,.72));box-shadow:0 24px 70px rgba(6,8,30,.5);animation:cardIn .8s var(--ease) backwards}
.card0 input{border-radius:16px;transition:border-color .25s,background .25s,box-shadow .25s}
.card0 input:focus{border-color:var(--acc);background:rgba(255,255,255,.12);box-shadow:0 0 0 4px rgba(255,220,143,.16)}
.tabs button{transition:background .3s var(--soft),color .3s,opacity .3s}
.tabs button.on{background:linear-gradient(135deg,#ffe8a8,#ffc0dc)}
.btn{border-radius:16px;background:linear-gradient(135deg,#ffe8a8,#ffb6d6 60%,#d2b8ff);color:#2b2447;box-shadow:0 8px 24px rgba(255,150,200,.32);transition:transform .2s var(--ease),filter .2s,box-shadow .3s}
.btn:active{transform:scale(.97)}
#cf:not([hidden]){animation:fadeUp .4s var(--ease) backwards}
/* اللوبي */
body.inlobby #top{animation:dropIn .7s var(--ease) backwards}
body.inlobby #nav button{animation:slideR .6s var(--ease) backwards}
#nav button:nth-child(1){animation-delay:.10s}#nav button:nth-child(2){animation-delay:.18s}#nav button:nth-child(3){animation-delay:.26s}#nav button:nth-child(4){animation-delay:.34s}
.pill{border-radius:18px;background:linear-gradient(160deg,rgba(40,44,96,.6),rgba(20,22,56,.6));box-shadow:0 6px 22px rgba(8,10,34,.28);transition:transform .25s var(--ease),background .3s}
button.pill:active{transform:scale(.94)}
#nav button{border-radius:20px;background:linear-gradient(160deg,rgba(40,44,96,.6),rgba(20,22,56,.6));box-shadow:0 6px 20px rgba(8,10,34,.26);transition:transform .25s var(--ease),background .3s,color .3s,opacity .3s}
#nav button:active{transform:scale(.92)}
#nav button.on{background:linear-gradient(135deg,#ffe8a8,#ffc0dc);box-shadow:0 8px 26px rgba(255,170,205,.4)}
#sheet{border-radius:24px;background:linear-gradient(165deg,rgba(40,44,96,.66),rgba(18,20,52,.66));box-shadow:0 18px 50px rgba(6,8,30,.42);animation:none}
#sheet.on{animation:sheetIn .5s var(--ease) backwards}
@media (orientation:portrait){#sheet.on{animation-name:sheetInP}}
#shb>*{animation:itemIn .5s var(--ease) backwards}
#shb>*:nth-child(2){animation-delay:.05s}#shb>*:nth-child(3){animation-delay:.1s}#shb>*:nth-child(4){animation-delay:.15s}#shb>*:nth-child(n+5){animation-delay:.2s}
.card{border-radius:18px;transition:transform .25s var(--ease),background .3s,border-color .3s}
.card:active{transform:scale(.95)}
.grid>.card{animation:cardIn .55s var(--ease) backwards}
.grid>.card:nth-child(1){animation-delay:0.04s}.grid>.card:nth-child(2){animation-delay:0.08s}.grid>.card:nth-child(3){animation-delay:0.12s}.grid>.card:nth-child(4){animation-delay:0.16s}.grid>.card:nth-child(5){animation-delay:0.20s}.grid>.card:nth-child(6){animation-delay:0.24s}.grid>.card:nth-child(7){animation-delay:0.28s}.grid>.card:nth-child(8){animation-delay:0.32s}.grid>.card:nth-child(9){animation-delay:0.36s}.grid>.card:nth-child(10){animation-delay:0.40s}.grid>.card:nth-child(11){animation-delay:0.44s}.grid>.card:nth-child(12){animation-delay:0.48s}
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
#toast{border-radius:999px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(8,10,34,.28);animation:toastIn .45s var(--ease) backwards}
/* داخل العالم: أزرار أنعم + دخول متدرّج */
